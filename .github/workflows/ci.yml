name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate server syntax
        run: |
          node --check server/app.js
          node --check server/db.js
          node --check server/routes/sessions.js
          node --check server/routes/health.js
          node --check server/middleware/responseHandler.js
          node --check server/monitoring/healthchecks-ping.js
          node --check server/monitoring/state.js
          node --check server/monitoring/server-health-check.js
          node --check server/monitoring/error-monitor.js
          node --check server/monitoring/research-pipeline-monitor.js
          bash -n server/scripts/period-reviews-checked.sh
          bash -n server/scripts/backup-checked.sh

      - name: Validate extension manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
          echo "manifest.json is valid JSON"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Run test suite with coverage
        run: pnpm test:coverage

      # 최소선 미달로 위 단계가 실패해도 리포트를 남긴다
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Write coverage summary
        if: always()
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

  # 연구 분석용 Python 포팅(metrics.py)이 프로덕션 JS 계산과 일치하는지 검증한다
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/synthetic-rehearsal
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: research/synthetic-rehearsal/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run research tests
        run: python -m unittest test_metrics test_run_analysis -v
