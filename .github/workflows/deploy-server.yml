name: Deploy Server

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync runtime files to server
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='extension/' \
            --exclude='node_modules/' \
            --exclude='server/test/' \
            --exclude='server/node_modules/' \
            --exclude='server/.env' \
            --exclude='server/*.db*' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ubuntu@${{ secrets.SERVER_HOST }}:~/youtube-bias-feedback/

      - name: Install deps & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/youtube-bias-feedback
            rm -rf server/test extension docs .github .git
            pnpm install --prod
            if [ -z "${{ secrets.DB_ENCRYPTION_KEY }}" ]; then
              echo "DB_ENCRYPTION_KEY secret이 비어 있어 배포를 중단합니다." >&2
              exit 1
            fi
            echo "PORT=3000" > server/.env
            echo "NODE_ENV=production" >> server/.env
            echo "DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}" >> server/.env
            echo "PERIOD_REVIEW_GEMINI_API_KEY=${{ secrets.PERIOD_REVIEW_GEMINI_API_KEY }}" >> server/.env
            echo "STUDY_END_REVEAL_CODE=${{ secrets.STUDY_END_REVEAL_CODE }}" >> server/.env
            echo "SERVER_HEALTH_PING_URL=${{ secrets.SERVER_HEALTH_PING_URL }}" >> server/.env
            echo "ERROR_MONITOR_PING_URL=${{ secrets.ERROR_MONITOR_PING_URL }}" >> server/.env
            echo "RESEARCH_PIPELINE_PING_URL=${{ secrets.RESEARCH_PIPELINE_PING_URL }}" >> server/.env
            echo "HEALTH_URL=https://viewlens.site/health" >> server/.env
            echo "ERROR_LOG_PATH=/home/ubuntu/.pm2/logs/youtube-bias-server-error.log" >> server/.env
            pm2 restart youtube-bias-server
