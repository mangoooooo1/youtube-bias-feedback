name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
  workflow_dispatch:

# 이 워크플로는 SSH로 서버에 접속해 배포할 뿐 GITHUB_TOKEN으로 GitHub API를 호출하는
# 단계가 없다 — 최소 권한 원칙에 따라 기본 상속 권한을 전부 꺼둔다(coderabbitai 지적 반영).
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/youtube-bias-feedback
            git checkout main
            git pull origin main
            pnpm install --prod
            if [ -z "${{ secrets.DB_ENCRYPTION_KEY }}" ]; then
              echo "DB_ENCRYPTION_KEY secret이 비어 있어 배포를 중단합니다." >&2
              exit 1
            fi
            echo "PORT=3000" > server/.env
            echo "NODE_ENV=production" >> server/.env
            echo "DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}" >> server/.env
            echo "PERIOD_REVIEW_GEMINI_API_KEY=${{ secrets.PERIOD_REVIEW_GEMINI_API_KEY }}" >> server/.env
            echo "STUDY_END_REVEAL_CODE=${{ secrets.STUDY_END_REVEAL_CODE }}" >> server/.env
            pm2 restart youtube-bias-server
