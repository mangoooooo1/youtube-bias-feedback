name: Release Extension

on:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Check if extension files changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^extension/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create config.js
        if: steps.check.outputs.changed == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          printf "export const YOUTUBE_API_KEY = '%s';\nexport const GEMINI_API_KEY = '%s';\nexport const SERVER_URL = '%s';\n" \
            "$YOUTUBE_API_KEY" "$GEMINI_API_KEY" "$SERVER_URL" > extension/config.js

      - name: Zip Extension
        if: steps.check.outputs.changed == 'true'
        run: |
          cd extension
          zip -r ../youtube-bias-feedback.zip . \
            --exclude "*.md" \
            --exclude "config.example.js"

      - name: Upload to Draft Release
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_tag=$(gh release list --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' | head -1)
          gh release upload "$draft_tag" youtube-bias-feedback.zip --clobber
