name: Release Extension

on:
  release:
    types: [published]
  # 이미 게시한 릴리스에 zip을 다시 붙일 때
  workflow_dispatch:
    inputs:
      tag:
        description: "zip을 붙일 릴리스 태그 (예: v3.4.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "${TAG#[vV]}" != "$version" ]; then
            echo "::error::태그 $TAG 와 manifest 버전 $version 이 다릅니다."
            exit 1
          fi

      - name: Create config.js and patch manifest.json
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::SERVER_URL secret이 비어 있습니다."
            exit 1
          fi
          printf "export const SERVER_URL = '%s';\n" "$SERVER_URL" > extension/config.js

          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            const serverOrigin = new URL('$SERVER_URL').origin + '/*';
            if (!manifest.host_permissions.includes(serverOrigin)) {
              manifest.host_permissions.push(serverOrigin);
            }
            fs.writeFileSync('extension/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Zip Extension
        run: |
          cd extension
          zip -r ../youtube-bias-feedback.zip . \
            --exclude "*.md" \
            --exclude "config.example.js" \
            --exclude "studio/*" \
            --exclude "test/*"

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" youtube-bias-feedback.zip --clobber
          echo "zip을 $TAG 릴리스에 붙였습니다."
